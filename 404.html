<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - 圈圈の个人主页</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        :root {
            --primary: #5a7de0;
            --primary-light: #8aa4f5;
            --primary-dark: #3a5ed0;
            --secondary: #ff7eb3;
            --accent: #42d392;
            --text: #333;
            --text-light: #666;
            --bg: #f8faff;
            --card-bg: #ffffff;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }
        
        body {
            background: linear-gradient(135deg, #e0f7fa 0%, #f8faff 100%);
            min-height: 100vh;
            color: var(--text);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* 动态背景 */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .floating-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(90, 125, 224, 0.1);
            animation: float 15s infinite linear;
        }
        
        .circle-1 {
            width: 200px;
            height: 200px;
            top: 10%;
            left: 5%;
            animation-delay: 0s;
        }
        
        .circle-2 {
            width: 150px;
            height: 150px;
            top: 60%;
            right: 10%;
            animation-delay: 3s;
        }
        
        .circle-3 {
            width: 100px;
            height: 100px;
            bottom: 20%;
            left: 15%;
            animation-delay: 6s;
        }
        
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }
        
        /* 404内容区域 */
        .container {
            max-width: 800px;
            text-align: center;
            z-index: 10;
        }
        
        .error-code {
            font-size: 10rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }
        
        .error-code::after {
            content: '404';
            position: absolute;
            top: 5px;
            left: 5px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: -1;
            filter: blur(10px);
            opacity: 0.7;
        }
        
        .error-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: var(--primary);
        }
        
        .error-description {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: var(--text-light);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        /* 搜索框 */
        .search-box {
            display: flex;
            max-width: 500px;
            margin: 0 auto 40px;
            box-shadow: var(--shadow);
            border-radius: 50px;
            overflow: hidden;
        }
        
        .search-input {
            flex: 1;
            padding: 15px 25px;
            border: none;
            outline: none;
            font-size: 1rem;
            background: white;
        }
        
        .search-button {
            padding: 15px 25px;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .search-button:hover {
            background: var(--primary-dark);
        }
        
        /* 按钮组 */
        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        
        .btn {
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(to right, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 15px rgba(90, 125, 224, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(90, 125, 224, 0.4);
        }
        
        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        
        .btn-secondary:hover {
            background: var(--primary);
            color: white;
        }
        
        /* 有趣的消息 */
        .fun-message {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            margin-top: 30px;
            position: relative;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .fun-message::before {
            content: '"';
            font-size: 5rem;
            color: var(--primary-light);
            position: absolute;
            top: -20px;
            left: 10px;
            opacity: 0.3;
        }
        
        .fun-message p {
            font-style: italic;
            color: var(--text-light);
        }
        
        /* 页脚 */
        .footer {
            margin-top: 50px;
            text-align: center;
            color: var(--text-light);
            font-size: 0.9rem;
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
        }
        
        .footer-links a {
            color: var(--text-light);
            text-decoration: none;
            transition: var(--transition);
        }
        
        .footer-links a:hover {
            color: var(--primary);
        }
        
        /* 404动画 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }
        
        .shake {
            animation: shake 0.5s ease-in-out;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .error-code {
                font-size: 8rem;
            }
            
            .error-title {
                font-size: 2rem;
            }
            
            .error-description {
                font-size: 1rem;
            }
            
            .button-group {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
                justify-content: center;
            }
        }
        
        @media (max-width: 480px) {
            .error-code {
                font-size: 6rem;
            }
            
            .error-title {
                font-size: 1.8rem;
            }
            
            .search-box {
                flex-direction: column;
                border-radius: 15px;
            }
            
            .search-input {
                border-radius: 15px 15px 0 0;
            }
            
            .search-button {
                border-radius: 0 0 15px 15px;
            }
        }
    </style>
</head>
<body>
    <!-- 动态背景 -->
    <div class="bg-animation">
        <div class="floating-circle circle-1"></div>
        <div class="floating-circle circle-2"></div>
        <div class="floating-circle circle-3"></div>
    </div>
    
    <!-- 主要内容 -->
    <div class="container">
        <div class="error-code" id="errorCode">404</div>
        
        <h1 class="error-title">哎呀！页面走丢了</h1>
        
        <p class="error-description">
            您要访问的页面可能已被移动、删除或者暂时不可用。
            请稍后在访问该内容，或者联系网站管理员解决此问题。
        </p>
        
        <!-- 搜索框 -->
        <div class="search-box">
            <input type="text" class="search-input" placeholder="搜索圈圈小站の内容...">
            <button class="search-button">
                <i class="fas fa-search"></i>
            </button>
        </div>
        
        <!-- 按钮组 -->
        <div class="button-group">
            <a href="index.html" class="btn btn-primary">
                <i class="fas fa-home"></i> 返回首页
            </a>
            <a href="javascript:history.back()" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> 返回上一页
            </a>
            <a href="update-logs.html" class="btn btn-secondary">
                <i class="fas fa-list"></i> 查看更新日志
            </a>
        </div>
        
        <!-- 有趣的消息 -->
        <div class="fun-message">
            <p>既然找不到，那不妨来看点<a href="114514.html">好看的</a></p>
	    
        </div>
    </div>
    
    <!-- 页脚 -->
    <div class="footer">
        <div class="footer-links">
            <a href="index.html">首页</a>
            <a href="update-logs.html">更新日志</a>
            <a href="index.html#projects">项目</a>
            <a href="index.html#contact">联系</a>
        </div>
        <p>© Circlecircles 2021-2025 Inc. | 圈圈の个人主页 | Website Version 3.3</p>
    </div>

    <script>
        // 404数字动画
        document.addEventListener('DOMContentLoaded', function() {
            const errorCode = document.getElementById('errorCode');
            
            // 页面加载时添加抖动效果
            setTimeout(function() {
                errorCode.classList.add('shake');
            }, 500);
            
            // 点击404数字时再次抖动
            errorCode.addEventListener('click', function() {
                this.classList.remove('shake');
                void this.offsetWidth; // 触发重排
                this.classList.add('shake');
            });
            
            // 搜索功能
            const searchButton = document.querySelector('.search-button');
            const searchInput = document.querySelector('.search-input');
            
            searchButton.addEventListener('click', function() {
                performSearch();
            });
            
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    alert(`你觉得我很勤劳会做搜索吗，这只是做来为了好看的，如果要做的话，咕咕咕`);
                } else {
                    searchInput.focus();
                }
            }
            
            // 添加一些随机有趣的消息
            const funMessages = [
                "崩坏：星穹铁道，启动！！！！！！",
                "哈基米哦南北绿豆~",
                "原神，__ __！！！",
                "114514",
                "你知道吗，其实你看到这句话的时候你成功被我硬控了0.5秒"
            ];
            
            const funMessageElement = document.querySelector('.fun-message p');
            const randomMessage = funMessages[Math.floor(Math.random() * funMessages.length)];
            funMessageElement.textContent = randomMessage;
        });
    </script>
</body>
</html>
