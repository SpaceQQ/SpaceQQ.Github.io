<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圈圈の个人主页</title>
</head>
<body>
    <script type="text/javascript">
        // 获取浏览器语言设置（通常是浏览器默认语言）
        var userLang = navigator.language || navigator.userLanguage;
        
        // 根据语言代码进行跳转
        if (userLang.indexOf('zh') > -1) {
            // 中文（包括简体和繁体）跳转到中文页面
            window.location.href = './zh-cn/index.html';
        } else if (userLang.indexOf('en') > -1) {
            // 英文跳转到英文页面
            window.location.href = './en/index.html';
        } else if (userLang.indexOf('zh-tw') > -1) {
            // 繁体跳转到繁体页面
            window.location.href = './zh-tl/index.html';
        } else {
            // 其他语言默认跳转到英文页面
            window.location.href = './en/index.html';
        }
    </script>
    
    <!-- 如果跳转失败，显示手动选择链接 -->
    <div style="text-align: center; margin-top: 50px;">
        <p style="text-align:center">如果没有自动跳转，请手动选择语言：</p>
        <a href="./zh-cn/index.html">中文(简体)</a> | 
        <a href="./en/index.html">English</a> | 
        <a href="./zh-tl/index.html">中文(繁体)</a>
    </div>
</body>
</html>
