<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名字还在想</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .download-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px;
        }
        
        .software-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .download-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .download-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        
        .download-card h3 {
            color: var(--primary-color);
            margin-top: 0;
        }
        
        .download-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 15px;
            width: 100%;
            transition: background-color 0.3s;
        }
        
        .download-btn:hover {
            background-color: #27ae60;
        }
        
        .software-info {
            margin-top: 30px;
            padding: 20px;
            background-color: var(--card-bg);
            border-radius: 10px;
            box-shadow: var(--shadow);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="download-container">
            <div class="software-header">
                <h1><i class="fas fa-tools"></i> 制作中的游戏</h1>
                <p class="version-info">开发者：HelloCircle Studio | 版本: Beta 1.0 | 状态: 开发中</p>
            </div>
            
            <div class="download-options">
                <div class="download-card">
                    <h3><i class="fas fa-download"></i> 下载</h3>
                    <p>当前版本正在开发中，敬请期待（预计一测日期2025年7月30日）</p>
                    <button class="download-btn" disabled style="opacity:0.5; cursor:not-allowed">
                        下载
                    </button>
                </div>
            </div>
            
            <div class="software-info">
                <h2><i class="fas fa-info-circle"></i> 开发进度</h2>
                <p>制作进度：10% 构思剧情以及发展目标</p>
                
                <h3><i class="fas fa-check-circle"></i> 敬请期待</h3>
                <p>我们正在努力开发中，将为您带来更好的游戏体验！</p>
            </div>
        </div>
    </div>
            <p class="footer">© Circlecircles 2021-2025 Inc.丨Website Version 3.1</p>
</body>
</html>
